name: dbt CI

on:
  pull_request:
    paths:
      - "models/**"
      - "macros/**"
      - "seeds/**"

jobs:
  dbt-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dbt
        run: pip install dbt-bigquery

      - name: Upload dbt artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dbt-artifacts
          path: target/

      - name: Download previous artifacts
        uses: actions/download-artifact@v4
        with:
          name: dbt-artifacts
          path: state/

      - name: dbt deps
        run: dbt deps

      - name: dbt build (changed only)
        run: |
          if [ -f state/manifest.json ]; then
            echo "Running state-based build"
            dbt build --select state:modified+ --state state/
          else
            echo "No state found, running full build"
            dbt build
          fi
